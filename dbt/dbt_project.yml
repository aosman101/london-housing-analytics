name: "london_housing_analytics"
version: "1.0.0"
config-version: 2

profile: "housing_warehouse"

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  london_housing_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  # ONS code for the London region; used as the earnings fallback when a borough estimate is suppressed.
  london_region_code: "E12000007"
  # Earnings are only attached to months within this many years of the ASHE reference year,
  # so historical months are never divided by present-day pay.
  earnings_max_lag_years: 1
